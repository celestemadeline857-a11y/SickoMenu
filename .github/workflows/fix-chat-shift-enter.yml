name: fix-chat-shift-enter
on:
  push:
    branches: [feature/chat-shift-enter]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hooks/Chat.cpp')
          s = p.read_text()
          old = '''\tbool shiftHeld = ImGui::IsKeyDown(0x10) || ImGui::IsKeyDown(0xA0) || ImGui::IsKeyDown(0xA1);\n\tif (shiftHeld) {\n\t\tauto textArea = __this->fields.freeChatField->fields.textArea;\n\t\tif (textArea->fields.text->fields.m_stringLength < textArea->fields.characterLimit) {\n\t\t\tauto text = convert_from_string(textArea->fields.text);\n\t\t\tTextBoxTMP_SetText(textArea, convert_to_string(text + "\\n"), NULL, NULL);\n\t\t}\n\t\treturn;\n\t}\n'''
          new = '''\tbool shiftHeld = ImGui::IsKeyDown(0x10) || ImGui::IsKeyDown(0xA0) || ImGui::IsKeyDown(0xA1);\n\tif (shiftHeld) {\n\t\tauto textArea = __this->fields.freeChatField->fields.textArea;\n\t\tauto text = convert_from_string(textArea->fields.text);\n\t\tif (text.length() < textArea->fields.characterLimit) {\n\t\t\ttext += "\\n";\n\t\t\tauto newText = convert_to_string(text);\n\t\t\ttextArea->fields.text = newText;\n\t\t\tTMP_Text_set_text((TMP_Text*)textArea->fields.outputText, newText, NULL);\n\t\t\tupdateCharCounterText(__this->fields.freeChatField);\n\t\t}\n\t\treturn;\n\t}\n'''
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-chat-shift-enter.yml .github/workflows/inspect-textbox.yml textbox.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add hooks/Chat.cpp .github/workflows/fix-chat-shift-enter.yml .github/workflows/inspect-textbox.yml textbox.txt
          git commit -m 'Fix chat shift enter input' || exit 0
          git push
